<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050708">
<meta name="description" content="Waschi BiS-Tool direkt auf Waschi.fun">
<title>BIS-Tools | Waschi.fun</title>
<link rel="stylesheet" href="/styles.css">
<style>
.bis-page{position:relative;z-index:2;padding:26px 0 42px}
.bis-shell{border:1px solid rgba(196,142,47,.62);border-radius:8px;overflow:hidden;background:#070a0d;box-shadow:0 18px 55px rgba(0,0,0,.42)}
.bis-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 18px;border-bottom:1px solid rgba(211,154,50,.32);background:linear-gradient(135deg,rgba(7,10,13,.98),rgba(17,20,27,.96))}
.bis-toolbar-text{min-width:0}.bis-toolbar .submark{display:block;margin-bottom:3px}.bis-toolbar h1{margin:0;color:#f0c45a;font:700 clamp(22px,3vw,32px) Georgia,serif}
.bis-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.bis-frame{display:block;width:100%;height:calc(100vh - 190px);min-height:720px;border:0;background:#090c10}
.bis-note{margin:12px 0 0;color:#a99d8a;font-size:13px;line-height:1.55}
@media(max-width:760px){
 .bis-page{padding-top:14px}.bis-toolbar{align-items:flex-start;flex-direction:column}.bis-actions{justify-content:flex-start}
 .bis-frame{height:calc(100vh - 230px);min-height:680px}
}
</style>
</head>
<body>
<div class="site-bg"></div>
<header class="header">
  <div class="container navwrap">
    <a class="brand" href="/"><span class="brand-logo" aria-hidden="true"></span><strong>WASCHI</strong></a>
    <button class="menu" aria-label="Menü">☰</button>
    <nav class="nav">
      <a href="/">Startseite</a>
      <a href="/team/">Waschi Gilde</a>
      <a href="/mythic/">M+ Team</a>
      <a href="/addons/">Erweiterungen</a>
      <a href="/bis/" aria-current="page">BIS-Tools</a>
      <a href="/streams/">Streams</a>
      <a href="/community/">Community</a>
    </nav>
    <div class="rightnav"><div class="lang"><button class="active" data-lang="de">DE</button><button data-lang="en">EN</button></div></div>
  </div>
</header>
<main class="container bis-page">
  <section class="bis-shell">
    <div class="bis-toolbar">
      <div class="bis-toolbar-text">
        <span class="submark">Waschi.fun · BIS-Tools</span>
        <h1>Waschi BiS-Tool</h1>
      </div>
      <div class="bis-actions">
        <a class="btn dark" href="/">← Zur Startseite</a>
        <a class="btn gold" href="/news/bislisten-online/">Anleitung</a>
      </div>
    </div>
    <iframe
      class="bis-frame"
      src="https://waschi-bis-tool-6qp4.vercel.app/"
      title="Waschi BiS-Tool"
      loading="eager"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </section>
  <p class="bis-note">Das BiS-Tool ist direkt in Waschi.fun eingebettet. Du bleibst beim Wechsel zwischen Gildenseite, Anleitung und Tool auf der Waschi-Homepage.</p>
</main>
<script src="/app.js"></script>
</body>
</html>
