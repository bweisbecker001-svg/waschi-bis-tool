name: Export Waschi.fun Backup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-waschi-backup.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Prepare complete PC backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/01_Homepage_STRATO
          mkdir -p backup/02_BiS_Tool_Quellcode
          mkdir -p backup/03_BiS_Tool_Download
          mkdir -p backup/04_Live_Daten

          # Aktuelle Homepage so aufbauen, wie sie fuer STRATO gedacht ist.
          cp -a homepage-overlay/. backup/01_Homepage_STRATO/
          rm -f backup/01_Homepage_STRATO/vercel.json
          cp strato-migration/.htaccess backup/01_Homepage_STRATO/.htaccess
          cp -a strato-migration/api backup/01_Homepage_STRATO/
          cp -a strato-migration/private backup/01_Homepage_STRATO/

          # Kompletter aktueller Quellstand des Projekts inklusive BiS-Tool.
          cp -a api backup/02_BiS_Tool_Quellcode/
          cp -a chunks backup/02_BiS_Tool_Quellcode/
          cp -a homepage-overlay backup/02_BiS_Tool_Quellcode/
          cp -a site-admin-backend backup/02_BiS_Tool_Quellcode/
          cp -a strato-migration backup/02_BiS_Tool_Quellcode/
          cp -a build_index.py Dockerfile requirements.txt README_WEB.md vercel.json .env.example .dockerignore backup/02_BiS_Tool_Quellcode/

          # Die auf Waschi.fun angebotene PC-Download-Datei des BiS-Tools.
          curl --fail --location --retry 3 \
            https://waschi-bis-tool.vercel.app/downloads/Waschi_WoW_BiS_Tool.zip \
            --output backup/03_BiS_Tool_Download/Waschi_WoW_BiS_Tool.zip

          # Oeffentliche Live-Inhalte als zusaetzlicher Daten-Snapshot.
          curl --fail --location --retry 3 https://waschi.fun/api/site-content \
            --output backup/04_Live_Daten/site-content.json || true
          curl --fail --location --retry 3 https://waschi.fun/api/health \
            --output backup/04_Live_Daten/health.json || true

          cat > backup/README_BACKUP.txt <<'EOF'
          WASCHI.FUN - KOMPLETTBACKUP FUER DEN PC

          Inhalt
          ======
          01_Homepage_STRATO
            Aktueller Homepage-Stand fuer STRATO inklusive .htaccess,
            PHP-API und privater Ordnerstruktur.

          02_BiS_Tool_Quellcode
            Aktueller Quellstand des Waschi/BiS-Projekts aus GitHub.

          03_BiS_Tool_Download
            Waschi_WoW_BiS_Tool.zip - die auf der Homepage angebotene
            PC-Download-Datei des BiS-Tools.

          04_Live_Daten
            Snapshot der aktuell oeffentlich erreichbaren News- und
            Kalenderdaten sowie API-Healthcheck.

          WICHTIG
          =======
          Sicherheitsgeheimnisse werden absichtlich NICHT aus STRATO oder
          Altare exportiert. Die im GitHub-Quellstand vorhandene
          strato-migration/private/config.php ist die Vorlage und enthaelt
          keine echten Produktions-Secrets.

          Fuer eine vollstaendige Wiederherstellung der Live-Anmeldung und
          des Discord-Bots muessen die Produktions-Secrets separat sicher
          aufbewahrt werden:
          - Discord Client ID / Client Secret
          - Session Secret
          - Voice Push Secret
          - Discord Bot Token

          Dieses Backup enthaelt keine .git-Historie.
          EOF

      - name: Upload complete backup
        uses: actions/upload-artifact@v4
        with:
          name: Waschi_fun_Komplettbackup_PC_2026-11-02
          path: backup/
          if-no-files-found: error
          retention-days: 7
