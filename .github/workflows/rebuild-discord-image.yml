name: Rebuild Discord image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild full-resolution image
        shell: bash
        run: |
          set -euo pipefail
          cat .discord-image-chunks/part*.txt | tr -d '\n\r ' | base64 -d > homepage-overlay/assets/discord-download-card.webp
          test "$(wc -c < homepage-overlay/assets/discord-download-card.webp)" -eq 472698
          rm -rf .discord-image-chunks
          rm -f .github/workflows/rebuild-discord-image.yml
      - name: Commit rebuilt image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore full-resolution Discord download artwork"
          git push origin HEAD:main
