name: Apply Blizzard download artwork

on:
  push:
    branches: [main]
    paths:
      - ".blizzard-final-chunks/**"
      - ".github/workflows/apply-blizzard-download-artwork.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build asset and update download card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homepage-overlay/assets
          cat .blizzard-final-chunks/part*.txt | tr -d '\n\r ' | base64 -d > homepage-overlay/assets/blizzard-download-card.webp
          test "$(wc -c < homepage-overlay/assets/blizzard-download-card.webp)" -eq 34380

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("homepage-overlay/download/index.html")
          s = html.read_text(encoding="utf-8")
          pattern = r'<div class="download-preview battle-net-preview">.*?</div>\s*</div>\s*<div class="download-copy">'
          replacement = '<div class="download-preview battle-net-preview">\n  <img src="/assets/blizzard-download-card.webp" alt="WoW-inspiriertes Blizzard-Downloadmotiv mit Waschi">\n </div>\n <div class="download-copy">'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Battle.net preview replacement failed: {n}")
          html.write_text(s2, encoding="utf-8")

          css = Path("homepage-overlay/downloads.css")
          c = css.read_text(encoding="utf-8")
          marker = "/* Blizzard download artwork fitted to existing tile */"
          block = """

/* Blizzard download artwork fitted to existing tile */
.battle-net-preview{padding:0;background:#080b12}
.battle-net-preview:before{display:none}
.battle-net-preview img{display:block;width:100%;height:100%;min-height:350px;max-width:none;object-fit:cover;object-position:center;filter:none}
@media(max-width:900px){.battle-net-preview img{min-height:280px}}
"""
          if marker not in c:
              c += block
          css.write_text(c, encoding="utf-8")
          PY

          rm -rf .blizzard-final-chunks .blizzard-image-chunks
          rm -f .github/workflows/apply-blizzard-download-artwork.yml

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Waschi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace Blizzard download artwork"
          git push origin HEAD:main
